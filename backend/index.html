<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Local LLM Chat (Dummy Frontend)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .chat-box {
      width: 400px;
      background: #020617;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    h2 {
      text-align: center;
      margin-bottom: 15px;
    }

    textarea {
      width: 100%;
      height: 80px;
      resize: none;
      border-radius: 6px;
      border: none;
      padding: 10px;
      font-size: 14px;
    }

    button {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      background: #1d4ed8;
    }

    .response {
      margin-top: 15px;
      padding: 10px;
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 6px;
      min-height: 60px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <div class="chat-box">
    <h2>Local LLM Chat</h2>

    <textarea id="question" placeholder="Ask something..."></textarea>
    <button onclick="sendQuestion()">Send</button>

    <div class="response" id="response">
      Response will appear here...
    </div>
  </div>

  <script>
    async function sendQuestion() {
      const question = document.getElementById("question").value;
      const responseDiv = document.getElementById("response");

      if (!question.trim()) {
        responseDiv.innerText = "Please enter a question.";
        return;
      }

      responseDiv.innerText = "Thinking...";

      try {
        const res = await fetch("http://localhost:8000/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: question
          })
        });

        const data = await res.json();

        if (data.success) {
          responseDiv.innerText = data.reply;
        } else {
          responseDiv.innerText = "Error from backend";
        }

      } catch (err) {
        responseDiv.innerText = "Backend not reachable";
      }
    }
  </script>

</body>
</html>
